<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o Meu Amor ❤️</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f43f5e;
            font-size: 24px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .heart {
            font-size: 50px;
            margin: 15px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .footer {
            margin-top: 20px;
            font-style: italic;
            color: #f43f5e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>Primeira primavera juntos 🤍🥹</h1>
        
        <p>
            Hoje completamos mais um momento especial juntos! Obrigado(a) por tudo, 
            por seres quem és e por me fazeres tão feliz todos os dias. 
            És a melhor pessoa do mundo e quero estar ao teu lado para sempre!
        </p>

        <div class="footer">Com todo o meu amor ❤️</div>
    </div>

</body>
</html>
